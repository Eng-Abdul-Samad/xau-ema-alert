[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-ema-alert"
version = "0.1.0"
description = "XAU/USD EMA 8/50 Gmail alert monitor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
  "pandas==2.2.3",
  "requests==2.32.3",
  "python-dotenv==1.0.1"
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
